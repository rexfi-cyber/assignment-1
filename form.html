<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALT SCHOOL Application Form</title>
</head>
<body>
  <header id="top">
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="form.html">Application Form</a></li>
      </ul>
    </nav>
    <h1>ALT SCHOOL Application Form</h1>
  </header>

  <main>
    <form action="#" method="post">
      <fieldset>
        <legend>Application Form</legend>

        <p>
          <label>Email address<br>
            <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </label>
        </p>

        <p>
          <label>Password<br>
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
        </p>

        <p><a href="#">Forgot password?</a></p>

        <p><button type="submit">Sign In</button></p>
      </fieldset>
    </form>

    <p>Don't have an account? <a href="https://portal.altschoolafrica.com/auth/create-account">Create an account</a></p>
    <p><a href="#top">Back to top</a></p>
  </main>

  <footer>
    <address>Galadinmawa Estate, Kuchingoro, FCT Abuja, Nigeria</address>
    <p>&copy; 2026 Oke Titobiloluwa Patience. All rights reserved.</p>
  </footer>
</body>
</html>
